[workspace]
resolver = "2"
members = [
    "crates/autonet-core",
    "crates/autonet-platform",
    "crates/autonet-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT OR Apache-2.0"
repository = "https://github.com/osworks/autonet"
authors = ["AutoNet contributors"]

[workspace.dependencies]
autonet-core = { path = "crates/autonet-core", version = "0.1.0" }
autonet-platform = { path = "crates/autonet-platform", version = "0.1.0" }

anyhow = "1"
clap = { version = "4", features = ["derive", "wrap_help"] }
# `autonet run` must survive the signal that stops its child, so it can reap the
# child and report the child's own exit code. Doing that by hand would mean
# sigaction on Unix and SetConsoleCtrlHandler on Windows, i.e. `#[cfg(target_os)]`
# in the CLI, which architecture.md rule 2 forbids. `termination` widens the
# handler from SIGINT alone to SIGTERM and SIGHUP.
ctrlc = { version = "3", features = ["termination"] }
# The machine's own name, for the default `<hostname>-autonet` instance. Reading
# it by hand is gethostname on Unix and GetComputerNameExW on Windows, i.e.
# `#[cfg(target_os)]` in the CLI, which architecture.md rule 2 forbids -- the
# same reasoning as ctrlc above. Its three dependencies are already in the lock.
hostname = "0.4"
# `autonet advertise` publishes a `.local` name for the selected address. The
# alternatives all bind the system responder -- zeroconf and astro-dnssd need
# Avahi headers on Linux and the Bonjour SDK on Windows, which breaks both the
# pure-Rust build and flake.nix's network-free sandbox -- and libmdns and
# searchlight need tokio in the CLI, which has none. mdns-sd is a self-contained
# pure-Rust responder. `default-features = false` drops its async and logging
# features, leaving three new transitive crates.
mdns-sd = { version = "0.21", default-features = false }
owo-colors = "4"
# `autonet status --qr` renders a QR code as terminal block characters. Its only
# optional dependencies are image, svg and pic, so `default-features = false`
# brings in zero transitive crates -- worth having right after mdns-sd added
# five. qr2term would have dragged in crossterm for a job owo-colors covers, and
# qrcodegen has no renderer at all.
qrcode = { version = "0.14", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
