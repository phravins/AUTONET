[package]
name = "autonet"
description = "Find the LAN address a service is actually reachable on, without hand-editing an IP"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# What someone with the problem would search for, which is not what the crate
# calls itself: nobody searches for "autonet".
keywords = ["network", "ip-address", "lan", "mdns", "cli"]
categories = ["command-line-utilities", "network-programming"]
# Relative to this manifest, so crates.io shows the repository's own README
# rather than a second one that drifts from it.
readme = "../../README.md"

# Package, binary and crates.io name are all `autonet`; the directory stays
# `crates/autonet-cli` to read well beside autonet-core and autonet-platform.
# Cargo would infer this block from src/main.rs, but it is what pins the binary
# name that release.yml builds with `--bin autonet`.
[[bin]]
name = "autonet"
path = "src/main.rs"

[dependencies]
autonet-core = { workspace = true }
autonet-platform = { workspace = true }
clap = { workspace = true }
ctrlc = { workspace = true }
hostname = { workspace = true }
mdns-sd = { workspace = true }
owo-colors = { workspace = true }
qrcode = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
