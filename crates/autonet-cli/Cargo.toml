[package]
name = "autonet"
description = "Find the LAN address a service is actually reachable on, without hand-editing an IP"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# crates.io allows five keywords. These are what someone with the problem would
# actually type into the search box, which is not the same as what the crate
# calls itself: nobody searches for "autonet".
keywords = ["network", "ip-address", "lan", "mdns", "cli"]
categories = ["command-line-utilities", "network-programming"]
# Relative to this manifest, so the crates.io front page shows the same README
# the repository does rather than a second one that drifts from it.
readme = "../../README.md"

# The package, the binary and the crates.io name are all `autonet`, so
# `cargo install autonet` gets you a binary called `autonet`. The directory is
# still `crates/autonet-cli`, which reads better next to `autonet-core` and
# `autonet-platform` and is invisible to anyone installing the tool.
#
# This `[[bin]]` block is therefore now redundant -- cargo would infer the same
# thing from src/main.rs -- but it is kept because it is the line that pins the
# binary name, and `.github/workflows/release.yml` builds `--bin autonet`.
[[bin]]
name = "autonet"
path = "src/main.rs"

[dependencies]
autonet-core = { workspace = true }
autonet-platform = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
ctrlc = { workspace = true }
hostname = { workspace = true }
mdns-sd = { workspace = true }
owo-colors = { workspace = true }
qrcode = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
