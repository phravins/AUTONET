[package]
name = "autonet-core"
description = "Network state model, address classification, and the AutoNet selection engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords = ["network", "ip-address", "lan", "routing"]
categories = ["network-programming"]
# tests/fixtures.rs reads its corpus from ../../tests/fixtures, outside this
# package, so shipping the test without the fixtures would publish a file that
# fails the moment anyone runs it. CI runs them from the workspace.
exclude = ["tests"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
