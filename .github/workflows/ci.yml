name: CI

# AutoNet's whole design rests on autonet-core being platform-free and
# autonet-platform being the only crate that talks to a kernel. That claim is
# only worth anything if it is checked on more than one kernel, so every push
# builds and tests on Linux, macOS and Windows.
#
# The live checks in crates/autonet-platform/tests/live.rs are deliberately
# *not* run here. They depend on which network the runner happens to be on, and
# a failure would say nothing about the code.
#
# What a green run does and does not prove. It proves each backend compiles and
# links against its real system libraries, that the platform-free logic passes
# on three kernels, and that the right arm of `provider()` is selected on each.
# It proves nothing about interface classification, routes, or VPNs: every
# runner is a VM with one virtual NIC, no Wi-Fi radio and no tunnel. Those
# claims only become true on real hardware — see
# docs/milestone-2a-acceptance.md for what that costs.

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch makes the first one's result irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # A warning that only appears in a log nobody reads is not a warning.
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Report every platform rather than cancelling the survivors: "does this
      # fail everywhere or only on Windows?" is the first question worth asking,
      # and it is unanswerable if the first red job kills the other two.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins the channel and components, so rustup resolves
      # the toolchain from the repository rather than from whatever the runner
      # image ships. Installing it as its own step keeps the download out of
      # the middle of the first cargo invocation's output.
      - name: Install the pinned toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version && cargo --version

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace
