name: Release

# Turns a version tag into downloadable binaries for five targets.
#
# Separate from ci.yml on purpose: minting a release needs `contents: write`,
# and ci.yml runs on pull_request, including from forks.
#
# Nothing here is signed or notarized. The macOS and Windows binaries are
# unsigned, which Gatekeeper and SmartScreen both have opinions about, and the
# install scripts and README say so.

on:
  push:
    tags: ['v*']
  # A rehearsal: builds all five targets and uploads them as workflow
  # artifacts without creating a release.
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The cross linker for the one target that needs one. Cargo reads
  # CARGO_TARGET_<TRIPLE>_LINKER only when building that triple, so setting it
  # unconditionally is inert on the other four rather than something to gate.
  CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

# Deliberately no `RUSTFLAGS: -D warnings` here, unlike ci.yml. The toolchain
# channel floats on stable, so a lint added in a Rust release published after
# the code was written would turn a tagged release into a failed one. Warnings
# are CI's job, on every push, where a red build costs nothing. A release is the
# wrong moment to discover a new clippy lint.

jobs:
  # Cheap, and first, because the failure it catches is the expensive one:
  # tagging v0.2.0 against a manifest that still says 0.1.0 produces five
  # archives named after a version that does not exist in the source.
  verify:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.manifest.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Read the version, and check the tag agrees
        id: manifest
        shell: bash
        run: |
          set -euo pipefail
          # Scoped to the [workspace.package] section: an unscoped grep for
          # `version =` would match the path dependencies a few lines below.
          version=$(sed -n '/^\[workspace\.package\]/,/^\[/{s/^version = "\(.*\)"/\1/p;}' Cargo.toml)
          if [ -z "$version" ]; then
            echo "::error::No version found in [workspace.package] in Cargo.toml"
            exit 1
          fi
          echo "manifest version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          # workflow_dispatch has no tag to compare against, and that is fine —
          # the rehearsal is allowed to run from a branch.
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "Ref is ${GITHUB_REF_TYPE} ${GITHUB_REF_NAME}, not a tag; skipping the comparison."
            exit 0
          fi
          tag=${GITHUB_REF_NAME#v}
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${version}."
            exit 1
          fi
          echo "tag ${GITHUB_REF_NAME} matches."

  build:
    name: ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      # Same reasoning as ci.yml: "does this fail on one target or all five?" is
      # unanswerable if the first red job cancels the rest.
      fail-fast: false
      matrix:
        include:
          # ubuntu-22.04, not ubuntu-latest: glibc is forward-compatible
          # only, so a binary linked against 2.39 will not start on Debian 12,
          # RHEL 9 or Raspberry Pi OS bookworm.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04
            archive: tar.gz
            packages: gcc-aarch64-linux-gnu
          # macos-latest runners are arm64, so this one is a cross build; the
          # macOS SDK ships both architectures and needs no extra linker.
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
          # Apple Silicon binaries need at least an ad-hoc signature or the
          # kernel refuses to run them, and stripping after linking is reported
          # to invalidate it. Nobody here has a Mac to confirm whether cargo's
          # `strip = true` actually does that, so this target ships unstripped
          # until someone can check. Deliberately temporary: revert to the
          # workspace default once a real arm64 Mac has run the artifact.
          #
          # Cargo has no per-target profile key, so it goes through RUSTFLAGS
          # rather than [profile.release].
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
            rustflags: -C strip=none
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip

    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned toolchain
        shell: bash
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add ${{ matrix.target }}
          rustc --version && cargo --version

      - name: Install the cross linker
        if: matrix.packages != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.packages }}

      # No Swatinem/rust-cache, unlike ci.yml: the artifact people download
      # should be built from a state this run produced in full.
      - name: Build
        shell: bash
        # `--bin autonet`, not `-p <package>`: the binary name survives package
        # renames.
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: cargo build --release --locked --target ${{ matrix.target }} --bin autonet

      # No separate strip step: [profile.release] already sets lto,
      # codegen-units = 1 and strip = true. The one exception is
      # aarch64-apple-darwin, handled by the matrix above.
      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          set -euo pipefail
          stem="autonet-${{ needs.verify.outputs.version }}-${{ matrix.target }}"
          mkdir "$stem"
          cp "target/${{ matrix.target }}/release/autonet" "$stem/"
          cp README.md LICENSE-APACHE "$stem/"
          tar czf "$stem.tar.gz" "$stem"
          ls -l "$stem.tar.gz"

      # A flat zip, with no wrapping directory: Scoop's `bin` entry names the
      # executable at the archive root, and Windows users unzipping by hand
      # expect the same. The Unix archives keep their directory because `tar xf`
      # into a home directory should not scatter three files across it.
      - name: Package (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $stem = "autonet-${{ needs.verify.outputs.version }}-${{ matrix.target }}"
          $files = @(
            "target/${{ matrix.target }}/release/autonet.exe",
            "README.md",
            "LICENSE-APACHE"
          )
          Compress-Archive -Path $files -DestinationPath "$stem.zip"
          Get-Item "$stem.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: autonet-*.${{ matrix.archive }}
          if-no-files-found: error

  release:
    name: Publish
    needs: [verify, build]
    # The rehearsal stops here. workflow_dispatch runs the matrix and leaves the
    # archives as workflow artifacts; only a tag mints a release.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          # Flatten five artifact names into one directory so a single
          # sha256sum can cover the set.
          merge-multiple: true

      # One file over all five archives: what the install scripts fetch and
      # grep, and what `sha256sum --check` expects.
      - name: Checksums
        shell: bash
        working-directory: artifacts
        run: |
          set -euo pipefail
          sha256sum autonet-*.tar.gz autonet-*.zip > SHA256SUMS
          cat SHA256SUMS

      # The preinstalled gh CLI rather than a third-party action: the step
      # holding a write token is the last place to add a dependency whose
      # maintainer could change what it does.
      - name: Create the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls -l artifacts
          # A release may already exist for this tag: someone drafted one in the
          # web UI while the matrix was building, or an earlier run of this job
          # got part way. `gh release create` refuses either way, which loses
          # five good builds over a naming collision. Attach to what is there
          # instead, and only create when there is nothing to attach to.
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "A release for $GITHUB_REF_NAME exists; attaching artifacts to it."
            gh release upload "$GITHUB_REF_NAME" artifacts/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              artifacts/*
          fi
